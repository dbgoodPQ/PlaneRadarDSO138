; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2


; ESP32-WROOM-32 dev board + JYE Tech DSO138 LCD module (ILI9341, 320x240, 8-bit parallel)
; Pins and panel settings are in include/config.h under PLANE_RADAR_DSO138.
; Build/upload:  pio run -e dso138 -t upload
; (The merged-image script and CI are C3-specific, so they are not used here.)
[env:dso138]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
board_build.embed_files = data/ui_font.vlw

build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  -DPLANE_RADAR_DSO138=1

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
