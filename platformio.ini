; ESP32-2432S028R "Cheap Yellow Display" (CYD), original 1-USB version
;   ILI9341 320x240 SPI display + XPT2046 resistive touch
; Build/upload:  pio run -e cyd -t upload
; Serial:        pio device monitor
; Unit tests:    pio test -e native   (needs a host C++ compiler; runs in CI)

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions/plane_radar.csv
; Adds `pio run -t merge -e cyd` -> firmware-merged.bin (flash at 0x0)
extra_scripts = post:scripts/merge_firmware.py

; LVGL reads include/lv_conf.h
build_flags =
  -std=gnu++17
  -DLV_CONF_INCLUDE_SIMPLE
  -I include

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  lvgl/lvgl@~9.2.2
  bblanchon/ArduinoJson@^7.4.2

; Native unit tests (test/): pure logic only, built for the PC. Each test
; includes the source file it covers; test/stubs fakes the few ESP-IDF headers
; that config.h pulls in.
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -I include
  -I test/stubs
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
