# Build CYD firmware on push/PR or manually (Actions tab > Build > Run workflow).
# Artifact: one merged .bin to flash at 0x0, plus the split .bin files.
name: Build

on:
  push:
    branches: [main, master, cyd-esp32-2432s028r]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build and merge
        run: |
          pio run -e cyd
          pio run -t merge -e cyd

      - name: Package firmware
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD=.pio/build/cyd
          mkdir -p dist/split
          cp "$BUILD/firmware-merged.bin" "dist/plane-radar-cyd-${SHORT_SHA}.bin"
          cp "$BUILD/bootloader.bin" "$BUILD/partitions.bin" "$BUILD/firmware.bin" dist/split/
          cat > dist/FLASHING.txt <<EOF
          Plane Radar - CYD (ESP32-2432S028R), commit ${SHORT_SHA}

          Easiest: flash plane-radar-cyd-${SHORT_SHA}.bin at address 0x0
            esptool.py --chip esp32 write_flash 0x0 plane-radar-cyd-${SHORT_SHA}.bin
            or a browser flasher: https://espressif.github.io/esptool-js/

          Split files (same result):
            0x1000   split/bootloader.bin
            0x8000   split/partitions.bin
            0xe000   boot_app0.bin (from the Arduino-ESP32 core)
            0x10000  split/firmware.bin
          EOF
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: plane-radar-cyd-${{ env.SHORT_SHA }}
          if-no-files-found: error
          path: dist/
